<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorki Gym Trainer V13.2 - Sprint A</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Gorki Gym Trainer</h1>
    </header>
    <main>
        <section id="library-section" class="screen active">
            <div class="controls">
                <input type="text" id="search-input" placeholder="Search exercises..." oninput="applyFilters()">
                <div id="category-filters" class="filters">
                    <button onclick="setFilter('')" class="filter-btn active" data-category="">All</button>
                    <button onclick="setFilter('Chest')" class="filter-btn" data-category="Chest">Chest</button>
                    <button onclick="setFilter('Back')" class="filter-btn" data-category="Back">Back</button>
                    <button onclick="setFilter('Legs')" class="filter-btn" data-category="Legs">Legs</button>
                    <button onclick="setFilter('Shoulders')" class="filter-btn" data-category="Shoulders">Shoulders</button>
                    <button onclick="setFilter('Arms')" class="filter-btn" data-category="Arms">Arms</button>
                    <button onclick="setFilter('Core')" class="filter-btn" data-category="Core">Core</button>
                </div>
            </div>
            <div id="exercise-list" class="exercise-list">
                <!-- Exercise cards will be inserted here -->
            </div>
        </section>
        <section id="detail-section" class="screen">
            <button id="back-btn" onclick="showLibrary()" class="back-btn">&larr; Back to Library</button>
            <div class="exercise-detail-card">
                <img id="detail-img" src="" alt="Exercise Image">
                <h2 id="detail-name"></h2>
                <p id="detail-muscles"></p>
                <div id="detail-tips">
                    <h3>Coaching Tips</h3>
                    <p>To be added...</p>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
