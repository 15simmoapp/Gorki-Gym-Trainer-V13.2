<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorki Gym Trainer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Gorki Gym Trainer</h1>
    </header>
    <nav>
        <button id="nav-home" onclick="showHome()">Home</button>
        <button id="nav-library" onclick="showLibrary()">Library</button>
        <button id="nav-workout" onclick="showWorkout()">Quick Workout</button>
        <button id="nav-history" onclick="showHistory()">History</button>
    </nav>
    <main>
        <div id="home-screen" class="screen">
            <h2>Home Dashboard</h2>
            <div id="last-session-summary">
                <h3>Last Session Summary</h3>
                <div id="last-session-content">No session data.</div>
            </div>
            <div id="recent-workouts">
                <h3>Recent Workouts</h3>
                <div id="recent-list">No recent workouts.</div>
            </div>
            <div id="stats">
                <h3>Training Stats</h3>
                <div id="stats-content">Stats will appear here.</div>
            </div>
            <div id="favourites">
                <h3>Favourite Exercises</h3>
                <div id="favourites-list">No favourites yet.</div>
            </div>
        </div>
        <div id="library-screen" class="screen" style="display:none;">
            <input type="text" id="search-input" placeholder="Search exercises..." oninput="applyFilters()" />
            <div id="filter-buttons">
                <button onclick="setFilter('All')" class="filter-btn" id="filter-All">All</button>
                <button onclick="setFilter('Chest')" class="filter-btn" id="filter-Chest">Chest</button>
                <button onclick="setFilter('Back')" class="filter-btn" id="filter-Back">Back</button>
                <button onclick="setFilter('Legs')" class="filter-btn" id="filter-Legs">Legs</button>
                <button onclick="setFilter('Shoulders')" class="filter-btn" id="filter-Shoulders">Shoulders</button>
                <button onclick="setFilter('Arms')" class="filter-btn" id="filter-Arms">Arms</button>
                <button onclick="setFilter('Core')" class="filter-btn" id="filter-Core">Core</button>
            </div>
            <div id="exercise-list"></div>
        </div>
        <div id="workout-screen" class="screen" style="display:none;">
            <h2>Quick Workout</h2>
            <div>
                <label for="select-exercise">Add Exercise:</label>
                <select id="select-exercise"></select>
                <button onclick="addExerciseToWorkout()">Add</button>
            </div>
            <div id="workout-exercises"></div>
            <button onclick="saveWorkout()">Save Workout</button>
            <div id="workout-summary"></div>
        </div>
        <div id="history-screen" class="screen" style="display:none;">
            <h2>Workout History</h2>
            <div id="history-list"></div>
            <div id="detail-screen" style="display:none;">
                <button onclick="showHistory()">Back to History</button>
                <div id="detail-content"></div>
            </div>
        </div>
    </main>
    <script src="exerciseRegistry.js"></script>
    <script src="app.js"></script>
</body>
</html>
